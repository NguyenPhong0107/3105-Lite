name: 3105Lite

options:
  bundleIdPrefix: com.vuphong

targets:
  3105Lite:
    type: application
    platform: iOS
    deploymentTarget: "16.0"

    sources:
      - path: 3105Lite
        excludes:
          - Info.plist

    info:
      path: 3105Lite/Info.plist

    settings:
      base:
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES